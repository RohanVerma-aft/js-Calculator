<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
   <div id="card">
     <h1>Calculator</h1>
     <div class="Calculator">
        <div class="display">0</div>
        <div class="buttons">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>/</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>*</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>-</button>

            <button>0</button>
            <button>.</button>
            <button>=</button>
            <button>+</button>
        </div>
        <div class="extra-buttons">
            <button id="clearAnswers" style="background-color: rgb(255, 111, 185);">Clear Blocks !</button>
            <button id="C">C</button>
        </div>
        <div class="answer"></div>
     </div>
     </div>
    <script src="script2.js"></script>
</body>
</html>
